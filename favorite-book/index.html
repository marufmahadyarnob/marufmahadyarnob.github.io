<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>প্রিয় বইগুলো</title>

<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="stylesheet" href="/css/favorite-book-style.css">

</head>

<body>

<header class="top-bar">

<a href="/" class="back-btn">← Back</a>

<input type="text" id="searchInput" placeholder="বই খুঁজুন...">

<div class="category-filter">

<button class="cat-btn" data-cat="all">All</button>
<button class="cat-btn" data-cat="Novel">Novel</button>
<button class="cat-btn" data-cat="Horror">Horror</button>
<button class="cat-btn" data-cat="History">History</button>
<button class="cat-btn" data-cat="Mystery">Mystery</button>
<button class="cat-btn" data-cat="Detective">Detective</button>
<button class="cat-btn" data-cat="Classic">Classic</button>
<button class="cat-btn" data-cat="Taranath-Tantrik">Taranath Tantrik</button>

</div>

<div class="total-count" id="totalCount">Total Books: 0</div>

</header>

<section class="banner">
<img src="/images/favorite-book.jpg" class="banner-img">
</section>

<p style="font-size: 14px; color: #cfcfcf; text-align: center; margin-top: 10px; opacity: 0.9;">
  <strong>বি.দ্র.:</strong> নিচের কার্ডগুলো AI generated ছবি এবং ডাটা Firebase থেকে লোড করা হয়।
</p>

<section class="book-container" id="bookContainer"></section>

<button id="topBtn">↑</button>

<!-- ⚡ IMPORTANT: module script MUST be here -->
<script type="module" src="./js/favorite-book.js"></script>

</body>

</html>
